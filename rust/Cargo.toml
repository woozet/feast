[package]
name = "feast-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
prost = "0.13"
prost-types = "0.13"
redis = { version = "0.27", features = ["tokio-comp", "cluster-async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shellexpand = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
murmur3 = "0.5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["std", "clock"] }
base64 = "0.22"
arrow = { version = "57", features = ["ffi", "ipc"] }
arc-swap = "1.7"
aws-config = "0.2"
aws-sdk-s3 = "0.2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-stream = "0.1"
